<div id="loginModalW3" class="w3-modal w3-animate-opacity">
    <div class="w3-modal-content w3-card-4 w3-animate-zoom modal-login-content">

        <header class="w3-container modal-login-header">
            <span onclick="document.getElementById('loginModalW3').style.display='none'"
                  class="w3-button w3-display-topright w3-hover-none w3-hover-text-light-grey modal-close-button">&times;</span>
            <h2 class="modal-login-title">Inicia Sesión</h2>
        </header>

        <div class="w3-container w3-padding-32">
            <form action="{{ url_for('auth.login') }}" method="post"> <p>
                    <label for="loginUsername"><b>Email</b></label>
                    <input class="w3-input w3-border w3-round-large w3-margin-bottom" type="text"
                           placeholder="Ingresa correo electrónico" name="email" id="loginUsername" required>
                </p>

                <p>
                    <label for="loginPassword"><b>Contraseña</b></label>
                    <input class="w3-input w3-border w3-round-large" type="password"
                           placeholder="Ingresa tu contraseña" name="password" id="loginPassword" required>
                </p>

                <p class="w3-center w3-margin-top">
                    <a href="#" class="modal-forgot-password-link">¿Olvidaste tu contraseña?</a>
                </p>

                <button class="w3-button w3-block w3-section w3-padding-large w3-round-xxlarge boton-principal w3-margin-top"
                        type="submit">
                    Iniciar Sesión
                </button>
            </form>
        </div>

        <footer class="w3-container w3-padding-16 modal-login-footer">
            <button onclick="document.getElementById('loginModalW3').style.display='none'"
                    type="button" class="w3-button w3-red w3-round-xxlarge w3-hover-red">Cancelar</button>
            <span class="w3-right w3-padding w3-hide-small modal-footer-text">¿No tienes cuenta? <a
                href="#" onclick="document.getElementById('loginModalW3').style.display='none'; document.getElementById('registerModalW3').style.display='block';"
                class="modal-footer-link">Regístrate</a></span>
        </footer>

    </div>
</div>
