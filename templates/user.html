<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Biblioteca Virtual - USUARIO </title>

<!------------------------------------- Bootstrap ------------------------------------------------->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!--------------------------------------- W3.css -------------------------------------------------->
<link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<!------------------------------ Diseño CSS personalizado ----------------------------------------->
<link rel="stylesheet" href="../static/css/style_user.css">

</head>


<body>
<!------------------------Tarjeta de contenido ------------------------------------------------------->
<body>
<div class="container-fluid vh-100 d-flex justify-content-center align-items-center bg-light">
        <div class="w3-card main-card"> <div class="w3-bar user-navbar w3-card-2">
                <a href="#" class="w3-bar-item w3-button user-navbar-logo-link"> 
                <img src="../static/images/logoUNETI.png" alt="Logo UNETI" class="user-navbar-logo">
                </a>
                <span class="w3-bar-item user-navbar-title">Biblioteca Virtual</span>
                
                <div class="w3-right">
                    </div>
            </div>

            <div class="row flex-grow-1 no-gutters"> 
<!------------------------ Barra de navegacion lateral  ------------------------------------------->             
                <div class="col-md-4 user-sidebar"> 
                    <div class="w3-bar-block">
                        <a href="#" class="w3-bar-item w3-button w3-hover-light-grey sidebar-item" onclick="loadContent('_inicio.html')">Inicio</a>
                        <a href="#" class="w3-bar-item w3-button w3-hover-light-grey sidebar-item" onclick="loadContent('_Explorarlibros.html')">Explorar Libros</a>
                        <a href="#" class="w3-bar-item w3-button w3-hover-light-grey sidebar-item" onclick="loadContent('_mislibros.html')">Mis Libros</a>
                        <a href="#" class="w3-bar-item w3-button w3-hover-light-grey sidebar-item" onclick="loadContent('_miuser.html')">Mi Perfil</a>
                        <a href="#" class="w3-bar-item w3-button w3-hover-light-grey sidebar-item" onclick="loadContent('_configuracion.html')">Configuración</a>
                        <hr class="w3-border-top">
                        <a href="{{ url_for('auth.logout') }}" class="w3-bar-item w3-button w3-hover-red sidebar-logout-item">Cerrar Sesión</a>
                    </div>
                </div>
<!------------------------ Contenido columna derecha ---------------------------------------------->
                <div class="col-md-8 user-content-area w3-container w3-padding-16">
                    <div id="dynamic-content">
                        <h2>¡Bienvenido, Usuario!</h2>
                        <p>Selecciona una opción del menú lateral para comenzar.</p>
                    </div>
                </div>

            </div>
            </div>
    </div>
<!------------------------------ Integracion  ------------------------------>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script> 
        async function loadContent(sectionName) {
            const dynamicContentDiv = document.getElementById('dynamic-content');
            // La URL ahora apunta al endpoint de Flask que sirve las secciones
            // Flask procesa url_for ANTES de que el JS se ejecute en el navegador.
            const baseUrl = "{{ url_for('user.user_sections', filename='') }}";
            const url = `${baseUrl}${sectionName}`; 

            try {
                const response = await fetch(url);
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Error al cargar la sección ${sectionName}: ${response.status} - ${errorText}`);
                }
                const html = await response.text();
                dynamicContentDiv.innerHTML = html;

                // Para que los scripts dentro de las secciones cargadas dinámicamente se ejecuten
                const scripts = dynamicContentDiv.querySelectorAll('script');
                scripts.forEach(script => {
                    const newScript = document.createElement('script');
                    if (script.src) {
                        newScript.src = script.src;
                    } else {
                        newScript.textContent = script.textContent;
                    }
                    // Añadir y remover para forzar la ejecución
                    document.head.appendChild(newScript).parentNode.removeChild(newScript);
                });

            } catch (error) {
                console.error('Error cargando la sección:', error);
                dynamicContentDiv.innerHTML = `<p class="w3-text-red w3-padding-16">Error al cargar el contenido de la sección: ${sectionName}<br>Detalles: ${error.message}</p>`;
            }
        }

        // Cargar la sección de inicio por defecto al cargar la página
        document.addEventListener('DOMContentLoaded', function() {
            loadContent('_inicio.html');
        });
    </script>

</body>
</html>
