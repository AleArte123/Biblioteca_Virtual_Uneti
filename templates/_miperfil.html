            <!-- Fila principal: Dos columnas -->

                    <!-- Contenido de la primera columna (menú) -->
                    <div class="d-flex flex-column h-100 w-100 p-3 text-center">
                        <div>
                            <ul class="list-unstyled">
                                <li class="mb-3">

                                </li>
                                <li class="mb-3">

                                <li class="mb-3">

            <div class="col-md-8 d-flex">
                
                <!-- Contenido de la segunda columna (contenido principal) -->

<!-- Ventana emergente Editar perfil -->
<div class="modal fade" id="editProfileModal" tabindex="-1" aria-labelledby="editProfileModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editProfileModalLabel">
                    <i class="fas fa-edit me-2"></i> Editar Datos Personales
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form>
                    <div class="mb-3">
                        <label for="editName" class="form-label">Nombre:</label>
                        <input type="text" class="form-control" id="editName" value="Usuario de Prueba">
                    </div>
                    <div class="mb-3">
                        <label for="editEmail" class="form-label">Correo Electrónico:</label>
                        <input type="email" class="form-control" id="editEmail" value="usuario@example.com">
                    </div>
                    <div class="mb-3">
                        <label for="editRole" class="form-label">Rol:</label>
                        <input type="text" class="form-control" id="editRole" value="Miembro" readonly>
                    </div>
                    </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                <button type="button" class="btn btn-success" onclick="saveProfileChanges()">Guardar Cambios</button>
            </div>
        </div>
    </div>
</div>

<!-- Ventana emergente Cambiar Contraseña -->
<div class="modal fade" id="changePasswordModal" tabindex="-1" aria-labelledby="changePasswordModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="changePasswordModalLabel">
                    <i class="fas fa-key me-2"></i> Cambiar Contraseña
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form>
                    <div class="mb-3">
                        <label for="currentPassword" class="form-label">Contraseña Actual:</label>
                        <input type="password" class="form-control" id="currentPassword">
                    </div>
                    <div class="mb-3">
                        <label for="newPassword" class="form-label">Nueva Contraseña:</label>
                        <input type="password" class="form-control" id="newPassword">
                    </div>
                    <div class="mb-3">
                        <label for="confirmNewPassword" class="form-label">Confirmar Nueva Contraseña:</label>
                        <input type="password" class="form-control" id="confirmNewPassword">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                <button type="button" class="btn btn-success" onclick="changePassword()">Cambiar Contraseña</button>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function saveProfileChanges() {
        // Obtenemos los valores de los campos del modal
        const newName = document.getElementById('editName').value;
        const newEmail = document.getElementById('editEmail').value;
        // const newRole = document.getElementById('editRole').value; // El rol es fijo 

        // Simulamos un proceso de guardado 
        // Por ahora, simplemente cerramos el modal y mostramos una alerta
        
        // Cierra el modal de Bootstrap
        const editProfileModal = bootstrap.Modal.getInstance(document.getElementById('editProfileModal'));
        if (editProfileModal) {
            editProfileModal.hide();
        }

        // Simulamos que el guardado fue exitoso y actualizamos los datos en la página
        document.getElementById('profileName').textContent = newName;
        document.getElementById('profileEmail').textContent = newEmail;
        // No actualizamos el rol ya que fijo en este ejemplo.

        alert('¡Cambios de perfil guardados exitosamente!');
    }

    function changePassword() {
        const currentPassword = document.getElementById('currentPassword').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmNewPassword = document.getElementById('confirmNewPassword').value;

        // Validaciones ficticias
        if (newPassword === "" || confirmNewPassword === "") {
            alert('Error: La nueva contraseña no puede estar vacía.');
            return;
        }

        if (newPassword !== confirmNewPassword) {
            alert('Error: La nueva contraseña y su confirmación no coinciden.');
            return;
        }

        // En un escenario real, aquí se enviarían las contraseñas a un servidor para validación y cambio.
        // Simularemos un éxito si las contraseñas coinciden y no están vacías.

        // Cierra el modal de Bootstrap
        const changePasswordModal = bootstrap.Modal.getInstance(document.getElementById('changePasswordModal'));
        if (changePasswordModal) {
            changePasswordModal.hide();
        }

        alert('¡Contraseña cambiada exitosamente!');
        
        // Opcional: Limpiar los campos del formulario después de un cambio exitoso
        document.getElementById('currentPassword').value = '';
        document.getElementById('newPassword').value = '';
        document.getElementById('confirmNewPassword').value = '';
    }
</script>


</body>
