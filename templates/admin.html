<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Virtual - Administrador</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../css/style_admin.css">

</head>
<body>
    <div class="container-fluid vh-100 d-flex justify-content-center align-items-center">
        <div class="w3-card-main">
        
        <!-- Fila superior: Navbar o encabezado -->
            <div class="biblio-banner mb-2">
                <div class="d-flex align-items-center justify-content-center">
                    <img class="logo-uneti" src="../images/uneti_logo.png" alt="Logo Uneti">
                    <h2 class="title-banner">BIBLIOTECA VIRTUAL</h2>
                </div>
            </div>
        
            <!-- Fila principal: Dos columnas -->
            <div class="row flex-grow-1" style="flex: 1 1 auto;">
                <div class="col-md-3 d-flex">
                    
                    <!-- Contenido de la primera columna (menú) -->
                    <div class="d-flex flex-column h-100 w-100 p-3 text-center">
                        <div>
                           <ul class="list-unstyled">
                                    <li class="mb-3">
                                        <a href="#" class="btn btn-info boton-navegacion w-100 py-2 d-flex align-items-center justify-content-center fw-bold shadow-sm active" onclick="loadContent('admin_dashboard.html', this)">
                                            <i class="fas fa-home me-2"></i> Inicio
                                        </a>
                                    </li>
                                    <li class="mb-3">
                                        <a href="#" class="btn btn-info boton-navegacion w-100 py-2 d-flex align-items-center justify-content-center fw-bold shadow-sm" onclick="loadContent('../templates/_gestionlibros.html', this)">
                                            <i class="fas fa-book me-2"></i> Gestionar Libros
                                        </a>
                                    </li>
                                    <li class="mb-3">
                                        <a href="#" class="btn btn-info boton-navegacion w-100 py-2 d-flex align-items-center justify-content-center fw-bold shadow-sm" onclick="loadContent('../templates/_gestionuser.html', this)">
                                            <i class="fas fa-user-edit me-2"></i> Gestionar Usuarios
                                        </a>
                                    </li>
                                    <li class="mb-3">
                                        <a href="#" class="btn btn-info boton-navegacion w-100 py-2 d-flex align-items-center justify-content-center fw-bold shadow-sm" onclick="loadContent('../templates/_estadisticas.html', this)">
                                            <i class="fas fa-tags me-2"></i> Estadísticas
                                        </a>
                                    </li>
                                    <li class="mb-3">
                                        <a href="../index.html" class="btn btn-danger boton-logout w-100 py-2 d-flex align-items-center justify-content-center fw-bold shadow-sm">
                                            <i class="fas fa-user-circle me-2"></i> Cerrar Sesión 
                                        </a>
                                    </li>    
                                </ul>
                        </div>
                        <div class="mt-auto">
                            <small class="mb-0">Diseñado por el Grupo 1 © 2025 <br>
                                            Programación 1 M2 <br>                           
                        </small>
                        </div>
                    </div>
                </div>
                <!-- Contenido de la segunda columna (contenido principal) -->    
                    <div class="col-md-9 d-flex">
                        <div id="main-content-area" class="p-4 rounded bg-white flex-grow-1 admin-scroll-area">
                        </div> 
                    </div> 
                </div> 
        </div>    
    </div> 
                            
                            
                            
                            
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Cargar el contenido de inicio por defecto al cargar la página
        loadContent('admin_dashboard.html', document.querySelector('.boton-navegacion.active'));
    });

    function loadContent(url, clickedButton) {
        const contentArea = document.getElementById('main-content-area');
        
        // Desactivar el botón activo actual
        const currentActive = document.querySelector('.boton-navegacion.active');
        if (currentActive) {
            currentActive.classList.remove('active');
        }
        // Activar el botón clicado
        if (clickedButton) {
            clickedButton.classList.add('active');
        }

        fetch(url)
            .then(response => {
                if (!response.ok) {
                    throw new Error('No se pudo cargar el contenido: ' + response.statusText);
                }
                return response.text();
            })
            .then(html => {
                contentArea.innerHTML = html;
                // Desplazar al inicio del contenido cargado (opcional)
                contentArea.scrollTop = 0; 
            })
            .catch(error => {
                console.error('Error al cargar la página:', error);
                contentArea.innerHTML = '<p class="text-danger">Error al cargar el contenido. Por favor, intente de nuevo.</p>';
            });
    }
</script>

<script src="../js/script_admin.js"></script>

</body>
</html>
