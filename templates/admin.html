</head>

<!------------------------Tarjeta de contenido ------------------------------------------------------->
<body>
<div class="container-fluid vh-100 d-flex justify-content-center align-items-center bg-light">
        <div class="w3-card main-card"> <div class="w3-bar admin-navbar w3-card-2"> 
                    <img src="../static/images/logoUNETI.png" alt="Logo UNETI" class="admin-navbar-logo">
                <span class="w3-bar-item admin-navbar-title">Biblioteca Virtual - Administración</span>
                
                <div class="w3-right">
                    </div>
            </div>
            <div class="row flex-grow-1 no-gutters"> 
<!------------------------ Barra de navegacion lateral  ------------------------------------------->                
                <div class="col-md-2 admin-sidebar"> <div class="w3-bar-block">
                        <a href="#" class="w3-bar-item w3-button w3-hover-light-grey sidebar-item" onclick="loadAdminContent('_dashboard_admin.html')">Inicio</a>
                        <a href="#" class="w3-bar-item w3-button w3-hover-light-grey sidebar-item" onclick="loadAdminContent('_gestionar_libros.html')">Gestionar Libros</a>
                        <a href="#" class="w3-bar-item w3-button w3-hover-light-grey sidebar-item" onclick="loadAdminContent('_gestionar_usuarios.html')">Gestionar Usuarios</a>
                        <a href="#" class="w3-bar-item w3-button w3-hover-light-grey sidebar-item" onclick="loadAdminContent('_estadisticas.html')">Estadísticas</a>

                    </div>
                </div>
<!------------------------ Contenido columna derecha ---------------------------------------------->
                <div class="col-md-10 admin-content-area w3-container w3-padding-16">
                    <div id="dynamic-content">
                        <h2>Bienvenido, Administrador!</h2>

                </div>

            </div>
            </div>
    </div>
<!------------------------------ Integracion  ------------------------------>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

     <script>
    // Función para cargar contenido dinámicamente en el panel de administración
    async function loadAdminContent(sectionName) {
    const dynamicContentDiv = document.getElementById('dynamic-content');
    // La URL ahora apunta al endpoint de Flask que sirve las secciones
    // Flask procesa url_for ANTES de que el JS se ejecute en el navegador.
    const baseUrl = "{{ url_for('admin.admin_sections', filename='') }}";
    const url = `${baseUrl}${sectionName}`; 

    try {
        const response = await fetch(url);
        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`Error al cargar la sección ${sectionName}: ${response.status} - ${errorText}`);
        }
        const html = await response.text();
        dynamicContentDiv.innerHTML = html;

        // Para que los scripts dentro de las secciones cargadas dinámicamente se ejecuten
        const scripts = dynamicContentDiv.querySelectorAll('script');
        scripts.forEach(script => {
            const newScript = document.createElement('script');
            if (script.src) {
                newScript.src = script.src;
            } else {
                newScript.textContent = script.textContent;
            }
            document.head.appendChild(newScript).parentNode.removeChild(newScript);
        });

    } catch (error) {
        console.error('Error cargando la sección de administración:', error);
        dynamicContentDiv.innerHTML = `<p class="w3-text-red w3-padding-16">Error al cargar el contenido de la sección de administración: ${sectionName}<br>Detalles: ${error.message}</p>`;
    }
}

    // Cargar la sección de dashboard por defecto al cargar la página
    document.addEventListener('DOMContentLoaded', function() {
        loadAdminContent('_dashboard_admin.html');
    });
</script>

</body>
