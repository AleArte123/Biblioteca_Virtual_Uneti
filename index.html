<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Virtual UNETI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    
    <link href="./css/style.css" rel="stylesheet">
    </head>

<body>
    <div class="container bg-light rounded p-2 my-5" style="min-height: calc(100vh - 2 * 3rem); display: flex;">
        <div class="row flex-grow-1">
            <div class="col-md-4 d-flex">
                <div class="d-flex flex-column h-100 w-100 p-3 text-center">
                    <div>
                        <img src="./images/uneti_logo.png" alt="Logo Uneti">
                        <h1 class="biblio-font">Biblioteca Virtual</h1>
                        <p>Un espacio diseñado para ampliar tus conocimientos.</p>
                    </div>
                    <div class="mt-auto">
                        <small class="mb-0">Diseñado por el Grupo 1 © 2025 <br>
                                            Programación 1 M2 <br>
                            
                        </small>
                    </div>
                </div>
            </div>
            <div class="col-md-8 d-flex">
                
                <div
                    class="biblio-banner w-100 d-flex flex-column justify-content-center align-items-center">
                    <h1 class="mb-4">¡Bienvenido!</h1>
                    <button id="btn-login" class="btn btn-primary btn-lg mb-3 w-75" data-bs-toggle="modal" data-bs-target="#loginModal">
                        <i class="fas fa-sign-in-alt me-2"></i>Inicia Sesión
                    </button>
                    <button id="btn-register" class="btn btn-success btn-lg mb-3 w-75" data-bs-toggle="modal" data-bs-target="#registerModal">
                        <i class="fas fa-user-plus me-2"></i>Regístrate
                    </button>
                    <a href="./home.html" class="btn btn-outline-secondary w-75">
                        <i class="fas fa-book-open me-2"></i>¡Disfruta de la biblioteca sin registrarte!
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>

<div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow-lg">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="loginModalLabel"><i class="fas fa-sign-in-alt me-2"></i>Iniciar Sesión</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                    aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="loginEmail" class="form-label"><i
                                class="fas fa-envelope me-2 text-primary"></i>Correo electrónico</label>
                        <input type="email" class="form-control" id="loginEmail" placeholder="usuario@ejemplo.com"
                            required autocomplete="email">
                            </div>
                    <div class="mb-3">
                        <label for="loginPassword" class="form-label"><i
                                class="fas fa-lock me-2 text-primary"></i>Contraseña</label>
                        <input type="password" class="form-control" id="loginPassword" placeholder="Contraseña"
                            required autocomplete="current-password">
                            </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="rememberMe">
                        <label class="form-check-label" for="rememberMe"><i
                                class="fas fa-check-square me-1 text-success"></i>Recuérdame</label>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-sign-in-alt me-2"></i>Entrar
                    </button>
                    <div id="loginMessage" class="mt-3 text-danger text-center" style="display:none;"></div> 
                </form>
            </div>
            <div class="modal-footer justify-content-between">
                <a href="#" class="text-decoration-none"><i class="fas fa-key me-1"></i>¿Olvidaste tu contraseña?</a>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow-lg">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title" id="registerModalLabel"><i class="fas fa-user-plus me-2"></i>Registrarse</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                    aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                <form id="registerForm">
                    <div class="mb-3">
                        <label for="registerName" class="form-label"><i class="fas fa-user me-2 text-success"></i>Nombre
                            completo</label>
                        <input type="text" class="form-control" id="registerName" placeholder="Nombre y Apellido"
                            required autocomplete="name">
                            </div>
                    <div class="mb-3">
                        <label for="registerEmail" class="form-label"><i
                                class="fas fa-envelope me-2 text-success"></i>Correo electrónico</label>
                        <input type="email" class="form-control" id="registerEmail" placeholder="usuario@ejemplo.com"
                            required autocomplete="email">
                            </div>
                    <div class="mb-3">
                        <label for="registerPassword" class="form-label"><i
                                class="fas fa-lock me-2 text-success"></i>Contraseña</label>
                        <input type="password" class="form-control" id="registerPassword" placeholder="Contraseña"
                            required autocomplete="new-password">
                            </div>
                    <div class="mb-3">
                        <label for="registerConfirmPassword" class="form-label"><i
                                class="fas fa-lock me-2 text-success"></i>Confirmar Contraseña</label>
                        <input type="password" class="form-control" id="registerConfirmPassword"
                            placeholder="Repite la contraseña" required autocomplete="new-password">
                            </div>
                    <button type="submit" class="btn btn-success w-100">
                        <i class="fas fa-user-plus me-2"></i>Registrarse
                    </button>
                </form>
            </div>
            <div class="modal-footer justify-content-between">
                <span>¿Ya tienes cuenta? <a href="#" id="showLoginFromRegister" class="text-decoration-none"><i
                            class="fas fa-sign-in-alt me-1"></i>Inicia sesión</a></span>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="./js/script.js"></script>
</body>

</html>
